<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Tax Slip / Document -->
  <path d="M 32 20 L 58 20 L 72 34 L 72 75 C 72 77.2 70.2 79 68 79 L 32 79 C 29.8 79 28 77.2 28 75 L 28 24 C 28 21.8 29.8 20 32 20 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Folded corner -->
  <path d="M 58 20 L 58 34 L 72 34" fill="#e2e8f0" stroke-linejoin="round"/>

  <!-- Slip Content Lines -->
  <line x1="38" y1="45" x2="62" y2="45" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="55" x2="62" y2="55" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="65" x2="50" y2="65" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Paid / Verified Badge -->
  <circle cx="70" cy="70" r="14" fill="#10b981" filter="url(#shadow)" />
  <circle cx="70" cy="70" r="10" fill="none" stroke="#34d399" stroke-width="2" />
  
  <!-- Checkmark -->
  <path d="M 64 70 L 68 74 L 76 64" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
